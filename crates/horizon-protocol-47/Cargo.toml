[package]
name = "horizon-protocol-47"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Isolated Minecraft Java 1.8.9 (Protocol 47) transport"

[dependencies]
aes = "0.8.4"
getrandom = "0.3"
rsa = { version = "0.10", features = ["pkcs1v15"] }
sha1 = "0.10"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }

[lints]
workspace = true

[dev-dependencies]
rand = "0.10"
