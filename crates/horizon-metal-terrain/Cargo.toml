[package]
name = "horizon-metal-terrain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native GPU-generated terrain commands behind a portable Rust encoding seam"
[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "native-hooks"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
[lints]
workspace = true
[dev-dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "noop"] }
pollster = "0.4"
