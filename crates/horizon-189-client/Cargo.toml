[package]
name = "horizon-189-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Metal client entry point for Minecraft 1.8.9"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
ab_glyph = "0.2.32"
base64 = "0.22"
serde_json = "1.0.151"
ureq = { version = "2", default-features = false, features = ["tls"] }
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
horizon-assets-189 = { path = "../horizon-assets-189" }
horizon-auth = { path = "../horizon-auth" }
horizon-client-platform = { path = "../horizon-client-platform" }
horizon-protocol-47 = { path = "../horizon-protocol-47" }
horizon-world-189 = { path = "../horizon-world-189" }
horizon-physics-189 = { path = "../horizon-physics-189" }
png = "0.18"
pollster = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }

[lints]
workspace = true

